# Base experiment configuration.
#
# PROVENANCE
# Every value carries a `source` marker:
#
#   paper        stated in the paper text available to this reproduction
#   release      taken from the original code release
#   unavailable  the paper places it in Table 1, which was not available;
#                the value here is a conventional default and is NOT the
#                paper's. Any result produced with it is a reproduction
#                under documented substitutions, not a replication.
#
# The paper states "complete training configurations and hyperparameter
# settings are presented in Table 1". Table 1 could not be recovered from
# the paper text or the released artifacts, so the fine-tuning and LAPT
# optimisation values below are marked `unavailable`. They must be replaced
# with Table 1's values before any number here is compared against the
# paper's Table 2.

model:
  name: xlm-roberta-base            # source: paper (Sec 6.1)

lgse:
  # The projection W (FastText 300-dim -> model embedding space) is learned:
  # trained jointly with the new token embeddings and saved with the
  # checkpoint. It is not a config option -- see src/lgse/projection.py.
  ngram_min: 3                      # source: release
  ngram_max: 5                      # source: release
  reg_lambda: 1.0                   # source: release
  fasttext_dim: 300                 # source: FastText standard release

lapt:                               # language-adaptive pretraining
  freeze_backbone: true             # source: paper -- only new embeddings train
  max_length: 128                   # source: release
  mlm_probability: 0.15             # source: unavailable (standard MLM default)
  learning_rate: 5.0e-5             # source: unavailable
  batch_size: 16                    # source: unavailable
  epochs: 1                         # source: unavailable

finetune:                           # downstream task fine-tuning
  learning_rate: 2.0e-5             # source: unavailable
  batch_size: 16                    # source: unavailable
  epochs: 5                         # source: unavailable
  max_length: 256                   # source: unavailable
  warmup_ratio: 0.1                 # source: unavailable
  weight_decay: 0.01                # source: unavailable

evaluation:
  seeds: [42, 43, 44, 45, 46]       # source: paper -- "repeated five times
                                    #   with different random seeds"; the paper
                                    #   does not state which seeds, so these are
                                    #   ours and are recorded per run
  metric: f1                        # source: paper -- F1 for NER, QA, classification
  model_selection: dev              # source: paper -- selection on dev, report test

data:
  fasttext:
    amharic:
      source: https://dl.fbaipublicfiles.com/fasttext/vectors-crawl/cc.am.300.bin.gz
      citation: Grave et al. (2018), FastText CC vectors
    tigrinya:
      source: https://huggingface.co/Hailay/fasttext-tigrinya
      citation: project-released Tigrinya FastText model

output:
  results_dir: results
  checkpoints_dir: checkpoints
  logs_dir: logs
