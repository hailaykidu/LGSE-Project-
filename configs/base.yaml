# Base experiment configuration.
#
# PROVENANCE
# Every value carries a `source` marker:
#
#   paper           stated in the paper text (arXiv:2603.22629)
#   implementation  not stated in the paper; chosen here and recorded as
#                   this repository's choice
#   unavailable     not stated in the paper. These are mandatory and must
#                   be set explicitly; runs raise if they are absent.
#
# Table 1 ("Hyperparameter settings used for further pretraining with
# morpheme-aware tokenization and fine-tuning") is applied below. The paper
# gives one shared table for both LAPT and fine-tuning and states
# hyperparameters are "consistent" across Amharic and Tigrinya, so the same
# values populate both sections.
#
# One value is marked `unavailable`: the regularization strength lambda
# (Sec 4.2). See IMPLEMENTATION_NOTES.md #8.

model:
  name: xlm-roberta-base            # source: paper (Sec 6.1)

lgse:
  # W is a square learned linear map (d x d), paper Sec 4.1. FastText must
  # therefore be trained at the model's embedding width, not 300-dim --
  # build_projection raises on a rectangular map. See IMPLEMENTATION_NOTES.md section 1.
  ngram_min: 3                      # source: implementation (not in the paper)
  ngram_max: 5                      # source: implementation (not in the paper)
  # MANDATORY. lambda in L_reg = lambda*||e_new - mu||^2 (paper Sec 4.2).
  # source: unavailable -- this implementation uses 1.0, recorded with every
  # result. Removing this key raises rather than applying a default.
  reg_lambda: 1.0

  # MANDATORY for FastText-using systems. Alignment matrix W (Sec 4.1):
  # path to a .pt/.npy file holding a d x d matrix.
  #
  # Sec 4.1 defines W; its construction is not specified there, so W is
  # supplied per run. There is no default, including the identity: leaving
  # this empty raises for LGSE runs. See IMPLEMENTATION_NOTES.md 1a.
  alignment_matrix_path: ""
  fasttext_dim: 768                 # source: paper (Sec 4.1) -- W is d x d,
                                    #   so FastText dim must equal the model's

lapt:                               # language-adaptive pretraining
  freeze_backbone: true             # source: paper (Sec 5) -- encoder preserved,
                                    #   only the embedding layer adapts
  max_length: 256                   # source: paper Table 1
  mlm_probability: 0.15             # source: paper Table 1
  learning_rate: 5.0e-5             # source: paper Table 1
  lr_scheduler_type: constant       # source: paper Table 1
  batch_size: 32                    # source: paper Table 1
  epochs: 10                        # source: paper Table 1
  weight_decay: 0.01                # source: paper Table 1
  optimizer: adamw                  # source: paper Table 1 ("Adam"; AdamW is
                                    #   used since weight decay is specified)
  adam_epsilon: 1.0e-8              # source: paper Table 1
  adam_beta1: 0.9                   # source: paper Table 1
  adam_beta2: 0.999                 # source: paper Table 1
  fp16: true                        # source: paper Table 1

finetune:                           # downstream task fine-tuning
  # Table 1 covers "further pretraining ... and fine-tuning" in one table.
  learning_rate: 5.0e-5             # source: paper Table 1
  lr_scheduler_type: constant       # source: paper Table 1
  batch_size: 32                    # source: paper Table 1
  epochs: 10                        # source: paper Table 1
  max_length: 256                   # source: paper Table 1
  weight_decay: 0.01                # source: paper Table 1
  adam_epsilon: 1.0e-8              # source: paper Table 1
  adam_beta1: 0.9                   # source: paper Table 1
  adam_beta2: 0.999                 # source: paper Table 1
  fp16: true                        # source: paper Table 1
  warmup_ratio: 0.0                 # source: paper Table 1 (constant schedule,
                                    #   no warmup stated)

evaluation:
  seeds: [42, 43, 44, 45, 46]       # the published specification states five
                                    #   runs with different random seeds; the
                                    #   values are not specified. 42-46 are the
                                    #   values used here, recorded per run
  metric: f1                        # F1 for the NER and QA tasks implemented here
  model_selection: dev              # source: paper -- selection on dev, report test

data:
  # REQUIRED DIMENSION: FastText must match `lgse.fasttext_dim` (768),
  # because LGSE's W is square (paper Sec 4.1). Both sources below are
  # 300-dim and must be retrained at 768 before use with xlm-roberta-base:
  #
  #   fasttext skipgram -input <corpus> -output <model> -dim 768
  #
  # Mismatched vectors raise; they are not reshaped. See
  # IMPLEMENTATION_NOTES.md section 1.
  fasttext:
    amharic:
      source: https://dl.fbaipublicfiles.com/fasttext/vectors-crawl/cc.am.300.bin.gz
      citation: Grave et al. (2018), FastText CC vectors
      dimension: 300
      usable_as_is: false             # 300 != 768; retrain required
    tigrinya:
      source: https://huggingface.co/Hailay/fasttext-tigrinya
      citation: project-released Tigrinya FastText model
      dimension: 300
      usable_as_is: false             # 300 != 768; retrain required

output:
  results_dir: results
  checkpoints_dir: checkpoints
  logs_dir: logs
